services:
  - type: web
    name: auto-razbor
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: INIT_DATA_MAX_AGE
        value: "86400"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      # For persistent catalog edits, configure CATALOG_FILE on a mounted disk.
      # Do not use the ephemeral filesystem for production catalog changes.
