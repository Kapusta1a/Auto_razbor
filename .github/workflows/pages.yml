name: Deploy AUTO_RAZBOR preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "data/catalog.seed.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate backend and catalog
        run: |
          node --check server.mjs
          node --check public/admin.js
          node --check public/generation.js
          npm run validate:data
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp public/index.html public/style.css public/app.js public/generation.html public/generation.js _site/
          cp data/catalog.seed.json _site/catalog.json
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
